<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>過聆訊後新股推薦｜三家聚焦</title>
<style>
  :root {
    --navy: #0f2744; --gold: #d69e2e; --green: #276749; --blue: #2b6cb0;
    --gray: #4a5568; --bg: #f7fafc; --card: #fff; --border: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang TC", "Noto Sans TC", "PingFang SC", sans-serif;
    background: var(--bg); color: #1a202c; line-height: 1.55; font-size: 15px;
  }
  .topbar {
    background: var(--navy); color: #fff; padding: 14px 24px;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100;
  }
  .topbar .brand { font-weight: 700; font-size: 16px; }
  .topbar .meta { font-size: 12px; opacity: .75; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }
  .hero {
    background: linear-gradient(135deg, #0f2744 0%, #1a365d 100%);
    color: #fff; border-radius: 16px; padding: 28px 24px; margin-bottom: 16px;
  }
  .hero h1 { font-size: 24px; margin-bottom: 6px; }
  .hero .sub { opacity: .85; font-size: 13px; margin-bottom: 18px; }
  .hero-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 700px) { .hero-cards { grid-template-columns: 1fr; } }
  .hero-card {
    background: rgba(255,255,255,.1); border-radius: 12px; padding: 16px;
    border: 1px solid rgba(255,255,255,.15); cursor: pointer;
    transition: background .2s, transform .15s; color: inherit;
    display: block; text-align: left; width: 100%; font-family: inherit;
  }
  .hero-card:hover { background: rgba(255,255,255,.18); transform: translateY(-2px); }
  .hero-card.active { background: rgba(255,255,255,.22); box-shadow: 0 0 0 2px rgba(251,211,141,.5); }
  .hero-card .stars { color: var(--gold); font-size: 17px; letter-spacing: 1px; }
  .hero-card .name { font-weight: 700; font-size: 16px; margin: 6px 0 4px; }
  .hero-card .tag { font-size: 12px; opacity: .85; }
  .hero-card .fund { margin-top: 10px; font-size: 13px; }
  .hero-card .fund b { color: #fbd38d; }
  .hero-card .vote-sum {
    margin-top: 12px; padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,.18);
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 14px;
  }
  .vote-pill {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(0,0,0,.28); border-radius: 999px;
    padding: 5px 12px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .vote-pill.up { color: #9ae6b4; }
  .vote-pill.down { color: #feb2b2; }
  .hero-card .hint { font-size: 11px; opacity: .65; margin-top: 10px; }
  .vote-how {
    background: #fffbeb; border: 1px solid #f6e05e; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 16px; font-size: 13px;
    text-align: left; color: #744210;
  }
  .ipo-panel {
    background: var(--card); border-radius: 16px; margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); border: 1px solid var(--border); overflow: hidden;
  }
  .ipo-panel-head {
    width: 100%; display: flex; align-items: center; gap: 12px;
    padding: 16px 18px; background: #fff; border: 0; cursor: pointer;
    font-family: inherit; text-align: left; color: inherit;
  }
  .ipo-panel-head:hover { background: #f7fafc; }
  .ipo-panel.open .ipo-panel-head { border-bottom: 1px solid var(--border); }
  .ipo-panel-head .chev { margin-left: auto; font-size: 18px; color: var(--gray); transition: transform .2s; flex-shrink: 0; }
  .ipo-panel.open .ipo-panel-head .chev { transform: rotate(180deg); }
  .ipo-panel-head .title-wrap { flex: 1; min-width: 0; }
  .ipo-panel-head h2 {
    font-size: 17px; color: var(--navy); margin: 0 0 4px;
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
  }
  .ipo-panel-head .one-liner { font-size: 12.5px; color: var(--gray); margin: 0; }
  .ipo-panel-body { display: none; padding: 8px 22px 22px; }
  .ipo-panel.open .ipo-panel-body { display: block; }
  .badge {
    display: inline-block; background: #edf2f7; color: var(--navy);
    font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600;
  }
  .badge.green { background: #c6f6d5; color: #276749; }
  .badge.blue { background: #bee3f8; color: #2b6cb0; }
  .vote-widget {
    background: #f8fafc; border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px; margin: 12px 0 16px;
  }
  .vote-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  .vbtn {
    border: 1.5px solid #e2e8f0; background: #fff; border-radius: 999px;
    padding: 10px 18px; min-height: 44px; font-size: 15px; font-family: inherit;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    color: var(--navy); transition: all .15s; touch-action: manipulation; user-select: none;
  }
  .vbtn:active { transform: scale(.97); }
  .vbtn:disabled { opacity: .55; cursor: not-allowed; }
  .vbtn.up.on { background: #c6f6d5; border-color: #68d391; color: #276749; font-weight: 700; }
  .vbtn.down.on { background: #fed7d7; border-color: #fc8181; color: #c53030; font-weight: 700; }
  .vote-status { font-size: 13px; color: var(--gray); }
  .vote-status b { color: var(--navy); }
  .meter { margin-top: 8px; }
  .meter-labels { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 6px; }
  .meter-labels .u { color: #276749; font-weight: 600; }
  .meter-labels .d { color: #c53030; font-weight: 600; }
  .meter-track { height: 10px; border-radius: 999px; background: #fed7d7; overflow: hidden; display: flex; }
  .meter-up { height: 100%; background: #48bb78; transition: width .35s ease; }
  .section-inner h3 { font-size: 14px; color: var(--navy); margin: 16px 0 8px; font-weight: 700; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 12px 0 16px; }
  @media (max-width: 700px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
  .kpi {
    background: #f7fafc; border-radius: 10px; padding: 12px 10px; border: 1px solid var(--border); text-align: left;
  }
  .kpi .label { font-size: 11px; color: var(--gray); }
  .kpi .val { font-size: 15px; font-weight: 700; color: var(--navy); margin-top: 4px; }
  .kpi .val.up { color: var(--green); }
  ul.clean { list-style: none; padding: 0; }
  ul.clean li { padding: 5px 0 5px 16px; position: relative; font-size: 13.5px; text-align: left; }
  ul.clean li::before { content: "•"; position: absolute; left: 2px; color: var(--gold); font-weight: 700; }
  ul.clean li b { color: var(--navy); }
  .risk { color: #c53030; }
  .meta-line { font-size: 13.5px; text-align: left; }
  .link a { color: var(--blue); text-decoration: none; border-bottom: 1px solid #bee3f8; }
  .peer-box {
    background: #f0fff4; border: 1px solid #9ae6b4; border-radius: 12px;
    padding: 14px 16px; margin-top: 14px; text-align: left;
  }
  .peer-box.blue { background: #ebf8ff; border-color: #90cdf4; }
  .peer-box h4 { font-size: 13.5px; margin-bottom: 6px; color: var(--navy); }
  .peer-box > p { font-size: 12.5px; color: var(--gray); margin-bottom: 10px; }
  .peer-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 4px; }
  .peer-table th, .peer-table td {
    border: 1px solid #e2e8f0; padding: 7px 10px; text-align: left; vertical-align: top;
  }
  .peer-table th { background: #edf2f7; font-weight: 600; }
  .section {
    background: var(--card); border-radius: 16px; padding: 24px 22px;
    margin-bottom: 20px; border: 1px solid var(--border);
  }
  .section h2 {
    font-size: 18px; color: var(--navy); border-left: 4px solid var(--gold);
    padding-left: 12px; margin-bottom: 8px;
  }
  .other-item {
    display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border);
    font-size: 13.5px; text-align: left; align-items: flex-start; flex-wrap: wrap;
  }
  .other-item:last-child { border-bottom: none; }
  .other-item .num {
    width: 28px; height: 28px; border-radius: 50%; background: #edf2f7; color: var(--navy);
    font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .other-item .body { flex: 1; min-width: 180px; }
  .other-item .cname { font-weight: 700; color: var(--navy); }
  .other-item .cinfo { color: var(--gray); font-size: 12.5px; margin-top: 2px; }
  .other-item .cinfo a { color: var(--blue); }
  .other-vote {
    display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
    flex-shrink: 0; margin-left: auto;
  }
  .other-vote .ov-btns { display: flex; gap: 6px; }
  .ovbtn {
    border: 1px solid #e2e8f0; background: #fff; border-radius: 999px;
    padding: 6px 10px; font-size: 12px; font-family: inherit; cursor: pointer;
    color: var(--navy); touch-action: manipulation; user-select: none; min-height: 36px;
  }
  .ovbtn:active { transform: scale(.97); }
  .ovbtn.up.on { background: #c6f6d5; border-color: #68d391; color: #276749; font-weight: 700; }
  .ovbtn.down.on { background: #fed7d7; border-color: #fc8181; color: #c53030; font-weight: 700; }
  .other-vote .ov-sum { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--gray); }
  .other-vote .ov-sum b.u { color: #276749; }
  .other-vote .ov-sum b.d { color: #c53030; }
  .footer {
    text-align: center; font-size: 12px; color: #718096;
    margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--border);
  }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #0f2744; color: #fff; padding: 12px 20px; border-radius: 999px;
    font-size: 14px; z-index: 9999; box-shadow: 0 4px 16px rgba(0,0,0,.25); max-width: 90%;
  }
  .conn-bar {
    font-size: 12px; color: #744210; background: #fffbeb; border: 1px solid #f6e05e;
    border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; display: none;
  }
  .conn-bar.show { display: block; }
  .conn-bar.err { background: #fff5f5; border-color: #feb2b2; color: #9b2c2c; }
  .loading { text-align: center; padding: 40px; color: var(--gray); }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">輝立証劵新股部</div>
  <div class="meta" id="topMeta">過聆訊後新股推薦</div>
</div>
<div class="wrap">
  <div id="connBar" class="conn-bar">正在載入…</div>
  <div id="app" class="loading">載入公司資料中…</div>
  <div class="footer">
    輝立証劵新股部 ｜ 數據來源：港交所聆訊後資料集<br>
    內容由後台維護 · 投票全組可見
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var SUPABASE_URL = "https://dqvqtmdnuzryowktbtgt.supabase.co";
  var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRxdnF0bWRudXpyeW93a3RidGd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2NTEzOTgsImV4cCI6MjEwODIyNzM5OH0.PWvX7llsDDSOd5DdA7NtGwAW14jD34dj1aRpk7m-YPk";
  var MY_STORE = "ipo_my_vote_cms_v1";

  var sb = null;
  try {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  } catch (e) {
    document.getElementById("app").textContent = "Supabase 初始化失敗";
    return;
  }

  var companies = [];
  var counts = {};
  var busy = false;
  var bar = document.getElementById("connBar");

  function setBar(msg, isErr) {
    if (!bar) return;
    bar.textContent = msg || "";
    if (!msg) { bar.classList.remove("show"); bar.classList.remove("err"); return; }
    bar.classList.add("show");
    if (isErr) bar.classList.add("err"); else bar.classList.remove("err");
  }

  function loadMy() {
    try { return JSON.parse(localStorage.getItem(MY_STORE) || "{}"); } catch (e) { return {}; }
  }
  function saveMy(o) {
    try { localStorage.setItem(MY_STORE, JSON.stringify(o)); } catch (e) {}
  }
  function toast(msg) {
    var old = document.querySelector(".toast");
    if (old) old.remove();
    var t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 1800);
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function bullets(arr, risk) {
    if (!arr || !arr.length) return "";
    return "<ul class=\"clean\">" + arr.map(function (t) {
      return "<li" + (risk ? " class=\"risk\"" : "") + ">" + esc(t) + "</li>";
    }).join("") + "</ul>";
  }

  function renderPeer(peer, blue) {
    if (!peer || !peer.title) return "";
    var h = "<div class=\"peer-box" + (blue ? " blue" : "") + "\"><h4>" + esc(peer.title) + "</h4>";
    if (peer.note) h += "<p>" + esc(peer.note) + "</p>";
    if (peer.headers && peer.rows) {
      h += "<table class=\"peer-table\"><tr>";
      peer.headers.forEach(function (x) { h += "<th>" + esc(x) + "</th>"; });
      h += "</tr>";
      peer.rows.forEach(function (row) {
        h += "<tr>";
        row.forEach(function (cell, i) {
          var span = (row.length === 2 && i === 1 && peer.headers.length === 3) ? "" : "";
          if (row.length === 1) h += "<td colspan=\"" + peer.headers.length + "\">" + esc(cell) + "</td>";
          else h += "<td>" + esc(cell) + "</td>";
        });
        h += "</tr>";
      });
      h += "</table>";
    }
    h += "</div>";
    return h;
  }

  function renderPage() {
    var tops = companies.filter(function (c) { return c.tier === "top"; });
    var others = companies.filter(function (c) { return c.tier === "other"; });
    var today = new Date();
    var ds = today.getFullYear() + "年" + (today.getMonth() + 1) + "月" + today.getDate() + "日";
    document.getElementById("topMeta").textContent = "過聆訊後新股推薦 · " + ds;

    var html = "";
    html += "<div class=\"hero\" id=\"overview\">";
    html += "<h1>過聆訊後新股推薦</h1>";
    html += "<div class=\"sub\">精選三家 · 點擊卡片展開詳情 ｜ 數據來源：港交所聆訊後資料集</div>";
    html += "<div class=\"hero-cards\">";
    tops.forEach(function (c, i) {
      html += "<button type=\"button\" class=\"hero-card\" data-open=\"" + esc(c.id) + "\" id=\"hero-" + esc(c.id) + "\">";
      html += "<div class=\"stars\">" + esc(c.stars || "") + "</div>";
      html += "<div class=\"name\">" + (i + 1) + " " + esc(c.name_zh) + "</div>";
      html += "<div class=\"tag\">" + esc(c.tagline || "") + "</div>";
      html += "<div class=\"fund\">預計集資 <b>" + esc(c.fund_text || "") + "</b></div>";
      html += "<div class=\"vote-sum\" data-sum=\"" + esc(c.id) + "\"><span class=\"vote-pill up\">🐮 0</span><span class=\"vote-pill down\">🐻 0</span></div>";
      html += "<div class=\"hint\">▼ 點擊展開全部詳情</div></button>";
    });
    html += "</div></div>";

    html += "<div class=\"vote-how\"><b>投票互動：</b>前三詳情與下方簡表均可撳 <b>📈 升</b>／<b>📉 跌</b>；票數全組可見。再撳可取消。</div>";

    tops.forEach(function (c, i) {
      var badgeClass = (c.stars || "").indexOf("★★★★★") === 0 ? "green" : "blue";
      html += "<div class=\"ipo-panel\" id=\"panel-" + esc(c.id) + "\">";
      html += "<button type=\"button\" class=\"ipo-panel-head\" data-open=\"" + esc(c.id) + "\">";
      html += "<div class=\"title-wrap\"><h2>" + (i + 1) + " " + esc(c.name_zh);
      html += " <span class=\"badge " + badgeClass + "\">" + esc(c.stars || "") + "</span>";
      if (c.badge_extra) html += " <span class=\"badge\">" + esc(c.badge_extra) + "</span>";
      html += "</h2><p class=\"one-liner\">" + esc(c.one_liner || "") + "</p></div>";
      html += "<span class=\"chev\">▼</span></button>";
      html += "<div class=\"ipo-panel-body section-inner\">";
      html += "<div class=\"vote-widget\" data-company=\"" + esc(c.id) + "\">";
      html += "<div class=\"vote-actions\">";
      html += "<button type=\"button\" class=\"vbtn up\" data-side=\"up\">📈 升</button>";
      html += "<button type=\"button\" class=\"vbtn down\" data-side=\"down\">📉 跌</button>";
      html += "<span class=\"vote-status\" data-status></span></div>";
      html += "<div class=\"meter\"><div class=\"meter-labels\">";
      html += "<span class=\"u\" data-lab-up>📈 升 0% (0)</span>";
      html += "<span class=\"d\" data-lab-down>📉 跌 0% (0)</span></div>";
      html += "<div class=\"meter-track\"><div class=\"meter-up\" data-meter style=\"width:50%\"></div></div></div></div>";

      var kpis = c.kpis_json || [];
      if (kpis.length) {
        html += "<div class=\"kpi-row\">";
        kpis.forEach(function (k) {
          html += "<div class=\"kpi\"><div class=\"label\">" + esc(k.label) + "</div>";
          html += "<div class=\"val" + (k.up ? " up" : "") + "\">" + esc(k.value) + "</div></div>";
        });
        html += "</div>";
      }
      if (c.position_json && c.position_json.length) {
        html += "<h3>市場地位</h3>" + bullets(c.position_json);
      }
      if (c.pros_json && c.pros_json.length) {
        html += "<h3>核心優勢</h3>" + bullets(c.pros_json);
      }
      if (c.risks_json && c.risks_json.length) {
        html += "<h3>主要風險</h3>" + bullets(c.risks_json, true);
      }
      html += "<h3>保薦人 · 聆訊後資料集</h3>";
      html += "<p class=\"meta-line\"><b>" + esc(c.sponsors || "見披露易") + "</b></p>";
      if (c.phip_url) {
        html += "<p class=\"link meta-line\" style=\"margin-top:4px;\"><a href=\"" + esc(c.phip_url) + "\" target=\"_blank\" rel=\"noopener\">聆訊後資料集 / 披露易</a></p>";
      }
      html += renderPeer(c.peer_json, i === 2);
      html += "</div></div>";
    });

    html += "<div class=\"section\" id=\"others\"><h2>其他過聆訊公司（簡表）</h2>";
    html += "<p style=\"font-size:12.5px;color:var(--gray);margin-bottom:10px;text-align:left;\">亦可撳 📈／📉 投票；票數全組可見。</p>";
    others.forEach(function (c, i) {
      html += "<div class=\"other-item\"><div class=\"num\">" + (i + 1) + "</div>";
      html += "<div class=\"body\"><div class=\"cname\">" + esc(c.name_zh) + "</div>";
      html += "<div class=\"cinfo\">" + esc(c.tagline || "");
      if (c.fund_text) html += " · 集資 <b>" + esc(c.fund_text) + "</b>";
      if (c.sponsors) html += " · " + esc(c.sponsors);
      if (c.phip_url) html += " · <a href=\"" + esc(c.phip_url) + "\" target=\"_blank\" rel=\"noopener\">資料連結</a>";
      html += "</div></div>";
      html += "<div class=\"other-vote\" data-ov=\"" + esc(c.id) + "\">";
      html += "<div class=\"ov-btns\">";
      html += "<button type=\"button\" class=\"ovbtn up\" data-company=\"" + esc(c.id) + "\" data-side=\"up\">📈</button>";
      html += "<button type=\"button\" class=\"ovbtn down\" data-company=\"" + esc(c.id) + "\" data-side=\"down\">📉</button>";
      html += "</div><div class=\"ov-sum\" data-ov-sum=\"" + esc(c.id) + "\">🐮 <b class=\"u\">0</b> · 🐻 <b class=\"d\">0</b></div></div></div>";
    });
    html += "</div>";

    html += "<div class=\"section\"><h2>打新建議（精簡）</h2><ul class=\"clean\">";
    tops.forEach(function (c) {
      html += "<li><b>" + esc(c.stars || "") + "</b> " + esc(c.name_zh) + "：" + esc(c.one_liner || c.tagline || "") + "</li>";
    });
    html += "</ul>";
    html += "<p style=\"margin-top:12px;font-size:12.5px;color:var(--gray);text-align:left;\">注：僅供參考，不構成投資建議。港股打新存在破發風險。</p></div>";

    document.getElementById("app").innerHTML = html;
    bindUI();
    paint();
  }

  function paint() {
    var my = loadMy();
    companies.forEach(function (c) {
      var k = c.id;
      var ct = counts[k] || { up: 0, down: 0 };
      var up = ct.up || 0, down = ct.down || 0, total = up + down;
      var upPct = total ? Math.round((up / total) * 100) : 0;
      var hero = document.querySelector('[data-sum="' + k + '"]');
      if (hero) {
        hero.innerHTML = '<span class="vote-pill up">🐮 ' + up + '</span><span class="vote-pill down">🐻 ' + down + '</span>';
      }
      var w = document.querySelector('.vote-widget[data-company="' + k + '"]');
      if (w) {
        var labUp = w.querySelector("[data-lab-up]");
        var labDown = w.querySelector("[data-lab-down]");
        var meter = w.querySelector("[data-meter]");
        var status = w.querySelector("[data-status]");
        if (labUp) labUp.textContent = "📈 升 " + upPct + "% (" + up + ")";
        if (labDown) labDown.textContent = "📉 跌 " + (total ? 100 - upPct : 0) + "% (" + down + ")";
        if (meter) meter.style.width = (total ? upPct : 50) + "%";
        w.querySelectorAll(".vbtn").forEach(function (btn) {
          btn.classList.remove("on");
          if (my[k] && btn.getAttribute("data-side") === my[k]) btn.classList.add("on");
        });
        if (status) {
          if (my[k] === "up") status.innerHTML = "你已投：<b>升</b> · 全組共 " + total + " 票";
          else if (my[k] === "down") status.innerHTML = "你已投：<b>跌</b> · 全組共 " + total + " 票";
          else status.innerHTML = total ? ("全組共 <b>" + total + "</b> 票") : "尚未有票";
        }
      }
      var ovSum = document.querySelector('[data-ov-sum="' + k + '"]');
      if (ovSum) ovSum.innerHTML = '🐮 <b class="u">' + up + '</b> · 🐻 <b class="d">' + down + '</b>';
      document.querySelectorAll('.ovbtn[data-company="' + k + '"]').forEach(function (btn) {
        btn.classList.remove("on");
        if (my[k] && btn.getAttribute("data-side") === my[k]) btn.classList.add("on");
      });
    });
  }

  async function fetchVotes() {
    try {
      var res = await sb.from("ipo_votes").select("id,up_votes,down_votes");
      if (res.error) throw res.error;
      (res.data || []).forEach(function (row) {
        counts[row.id] = { up: row.up_votes || 0, down: row.down_votes || 0 };
      });
      setBar("");
      paint();
    } catch (e) {
      setBar("投票讀取失敗：" + (e.message || e), true);
    }
  }

  async function cast(company, side) {
    if (busy) return;
    busy = true;
    document.querySelectorAll(".vbtn, .ovbtn").forEach(function (b) { b.disabled = true; });
    var my = loadMy();
    var prev = my[company];
    try {
      var cur = await sb.from("ipo_votes").select("up_votes,down_votes").eq("id", company).maybeSingle();
      if (cur.error) throw cur.error;
      var up = (cur.data && cur.data.up_votes) || 0;
      var down = (cur.data && cur.data.down_votes) || 0;
      if (prev === side) {
        if (side === "up") up = Math.max(0, up - 1); else down = Math.max(0, down - 1);
        delete my[company];
        toast("已取消");
      } else {
        if (prev === "up") up = Math.max(0, up - 1);
        if (prev === "down") down = Math.max(0, down - 1);
        if (side === "up") up += 1; else down += 1;
        my[company] = side;
        var nm = (companies.find(function (x) { return x.id === company; }) || {}).name_zh || company;
        toast((side === "up" ? "📈 升" : "📉 跌") + " · " + nm);
      }
      var upd = await sb.from("ipo_votes").upsert({ id: company, up_votes: up, down_votes: down });
      if (upd.error) throw upd.error;
      counts[company] = { up: up, down: down };
      saveMy(my);
      paint();
    } catch (e) {
      toast("同步失敗：" + (e.message || e));
      setBar("寫入失敗：" + (e.message || e), true);
    }
    busy = false;
    document.querySelectorAll(".vbtn, .ovbtn").forEach(function (b) { b.disabled = false; });
  }

  function openPanel(id) {
    var panel = document.getElementById("panel-" + id);
    if (!panel) return;
    var was = panel.classList.contains("open");
    document.querySelectorAll(".ipo-panel.open").forEach(function (p) { p.classList.remove("open"); });
    document.querySelectorAll(".hero-card.active").forEach(function (c) { c.classList.remove("active"); });
    if (!was) {
      panel.classList.add("open");
      var hero = document.getElementById("hero-" + id);
      if (hero) hero.classList.add("active");
      setTimeout(function () { panel.scrollIntoView({ behavior: "smooth", block: "start" }); }, 40);
    }
  }

  function bindUI() {
    document.querySelectorAll("[data-open]").forEach(function (el) {
      el.addEventListener("click", function () {
        openPanel(el.getAttribute("data-open"));
      });
    });
    document.querySelectorAll(".vote-widget").forEach(function (w) {
      w.querySelectorAll(".vbtn").forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.preventDefault(); e.stopPropagation();
          cast(w.getAttribute("data-company"), btn.getAttribute("data-side"));
        });
      });
    });
    document.querySelectorAll(".ovbtn").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.preventDefault(); e.stopPropagation();
        cast(btn.getAttribute("data-company"), btn.getAttribute("data-side"));
      });
    });
  }

  async function init() {
    setBar("正在載入公司資料…");
    try {
      var res = await sb.from("ipo_companies").select("*").eq("active", true).order("rank", { ascending: true });
      if (res.error) throw res.error;
      companies = res.data || [];
      if (!companies.length) {
        document.getElementById("app").innerHTML = "<p class=\"loading\">尚無公司資料。請先在 Supabase 執行 02_seed.sql，或用後台新增。</p>";
        setBar("無資料", true);
        return;
      }
      companies.forEach(function (c) {
        if (typeof c.kpis_json === "string") try { c.kpis_json = JSON.parse(c.kpis_json); } catch (e) {}
        if (typeof c.position_json === "string") try { c.position_json = JSON.parse(c.position_json); } catch (e) {}
        if (typeof c.pros_json === "string") try { c.pros_json = JSON.parse(c.pros_json); } catch (e) {}
        if (typeof c.risks_json === "string") try { c.risks_json = JSON.parse(c.risks_json); } catch (e) {}
        if (typeof c.peer_json === "string") try { c.peer_json = JSON.parse(c.peer_json); } catch (e) {}
      });
      renderPage();
      await fetchVotes();
      setInterval(fetchVotes, 12000);
    } catch (e) {
      document.getElementById("app").innerHTML = "<p class=\"loading\">載入失敗：" + esc(e.message || e) + "<br>請確認已執行 01_schema.sql 與 02_seed.sql</p>";
      setBar("載入失敗", true);
    }
  }

  init();
})();
</script>
</body>
</html>
