    <!-- 📊 控制實時投票與動態渲染的 JavaScript 底層邏輯 -->
    <script>
        // 頁面載入後自動向資料庫抓取最新票數
        async function fetchVotes() {
            const { data, error } = await supabase.from('ipo_votes').select('*');
            if (error) return console.error('Error fetching votes:', error);
            
            data.forEach(item => {
                const total = item.up_votes + item.down_votes;
                const upPercent = total === 0 ? 0 : Math.round((item.up_votes / total) * 100);
                const downPercent = total === 0 ? 0 : Math.round((item.down_votes / total) * 100);

                // 更新前端網頁文字顯示
                document.getElementById(`vote-${item.id}-up-res`).innerText = `${upPercent}% (${item.up_votes}票)`;
                document.getElementById(`vote-${item.id}-down-res`).innerText = `${downPercent}% (${item.down_votes}票)`;
                
                // 檢查該用戶是否已經投過票，如果投過就鎖定按鈕
                if (localStorage.getItem(`voted_${item.id}`)) {
                    disableButtons(item.id);
                }
            });
        }

        // 處理使用者投票點擊
        async function castVote(id, type) {
            if (localStorage.getItem(`voted_${id}`)) {
                alert('您已經對這隻新股投過票囉！');
                return;
            }

            // 先在本地瀏覽器做標記防止重複投票
            localStorage.setItem(`voted_${id}`, type);
            disableButtons(id);

            // 向 Supabase 雲端資料庫發送更新請求 (使用 RPC 原子計數避免數據衝突)
            const column = type === 'up' ? 'up_votes' : 'down_votes';
            
            // 獲取目前最新數值並加 1 (簡單計數邏輯)
            const { data: currentData } = await supabase.from('ipo_votes').select(column).eq('id', id).single();
            let newVotes = (currentData ? currentData[column] : 0) + 1;

            const updatePayload = {};
            updatePayload[column] = newVotes;

            const { error } = await supabase.from('ipo_votes').update(updatePayload).eq('id', id);
            
            if (error) {
                console.error('Vote failed:', error);
                localStorage.removeItem(`voted_${id}`); // 失敗時解鎖
            } else {
                // 投票成功後立刻重新抓取最新數據刷新網頁
                fetchVotes();
            }
        }

        function disableButtons(id) {
            document.getElementById(`btn-${id}-up`).disabled = true;
            document.getElementById(`btn-${id}-down`).disabled = true;
            document.getElementById(`btn-${id}-up`).classList.add('opacity-60', 'cursor-not-allowed');
            document.getElementById(`btn-${id}-down`).classList.add('opacity-60', 'cursor-not-allowed');
            
            const userChoice = localStorage.getItem(`voted_${id}`);
            if (userChoice) {
                document.getElementById(`btn-${id}-${userChoice}`).classList.add('ring-2', 'ring-indigo-600', 'bg-indigo-50');
            }
        }

        // 初始化載入
        fetchVotes();
        // 每隔 10 秒自動同步一次最新投票，實現準實時大螢幕效果
        setInterval(fetchVotes, 10000);
    </script>
